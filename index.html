<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz das provas PPGI</title>
<meta name="description" content="As provas de conhecimento do PPGI/UFAM de 2016 a 2023 em formato de quiz: o conceito antes de responder, o porquê de cada alternativa depois e o assunto do LPEDC onde estudar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Estilo editorial-greeting (design-taste-frontend, seed 1055316735).
   Coluna centrada de 1100px em 12 colunas: 12 x 77 + 11 x 16 = 1100. */
:root {
  --ground: #ffffff; --surface: #f9f9f9; --raised: #ffffff;
  --border: #eaeaea; --rule: #f3f3f3; --control: #d9d9d6;
  --text: #1f201d; --muted: #636361;
  --accent: #1b6e66; --accent-pale: #e3f0ee;
  --primary: #1f201d; --on-primary: #ffffff;
  --positive: #2e7d32; --negative: #b42318;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #fdecea; --pill-negative-ink: #7a1d14;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e;
  --pill-neutral-bg: #f3f3f3; --pill-neutral-ink: #3d3d3a;
  --code-bg: #f3f3f1;
  --radius-card: 22px; --radius-inner: 14px; --radius-control: 999px;
  --gap: 16px; --pad: 20px; --control-height: 38px;
  --font: "Instrument Sans", Inter, system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000; --surface: #111111; --raised: #1a1a1a;
    --border: #2e2e2e; --rule: #1c1c1c; --control: #444444;
    --text: #ffffff; --muted: #b4b4b4;
    --accent: #5fb8ad; --accent-pale: #12302c;
    --primary: #ffffff; --on-primary: #000000;
    --positive: #3fc07a; --negative: #e5566f;
    --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a;
    --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
    --pill-warning-bg: #2a2214; --pill-warning-ink: #f0b860;
    --pill-neutral-bg: #222222; --pill-neutral-ink: #d0d0d0;
    --code-bg: #0b0b0b;
  }
}
:root[data-theme="dark"] {
  --ground: #000000; --surface: #111111; --raised: #1a1a1a;
  --border: #2e2e2e; --rule: #1c1c1c; --control: #444444;
  --text: #ffffff; --muted: #b4b4b4;
  --accent: #5fb8ad; --accent-pale: #12302c;
  --primary: #ffffff; --on-primary: #000000;
  --positive: #3fc07a; --negative: #e5566f;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a;
  --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2a2214; --pill-warning-ink: #f0b860;
  --pill-neutral-bg: #222222; --pill-neutral-ink: #d0d0d0;
  --code-bg: #0b0b0b;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font: 400 16px/1.55 var(--font);
}
a { color: inherit; text-decoration-color: var(--control); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.so-curto { display: none; }
.chave .lua { display: none; }
@media (max-width: 560px) { .chave .lua { display: block; } .chave { padding: 0 12px; } }

/* coluna e cabeçalho */
.coluna { max-width: 1132px; margin: 0 auto; padding: 0 16px; }
.cabeca { display: flex; align-items: center; gap: 12px; padding: 24px 0 0; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 15px; }
.marca svg { display: block; }
.marca small { font-weight: 400; color: var(--muted); }
.espaco { flex: 1; }
.chave {
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px; height: var(--control-height);
  padding: 0 14px; border: 1px solid var(--control); border-radius: var(--radius-control);
  background: var(--ground); cursor: pointer; font-size: 14px;
}
.chave[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.chave .bola { width: 8px; height: 8px; border-radius: 50%; background: var(--control); }
.chave[aria-pressed="true"] .bola { background: var(--on-primary); }
main { padding: 48px 0 96px; }

/* início */
h1.saudacao { font: 400 48px/1.08 var(--serif); letter-spacing: -0.01em; margin: 0; max-width: 18ch; }
.linha-cinza { color: var(--muted); font-size: 16px; margin: 12px 0 0; max-width: 62ch; }
.grade { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); margin-top: 48px; align-items: start; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; }
.s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
.contador {
  background: var(--surface); border-radius: var(--radius-card); padding: 16px 20px;
  min-height: 128px; display: flex; flex-direction: column;
}
.contador .rotulo { font-size: 14px; color: var(--muted); }
.contador .valor { font-size: 32px; line-height: 1.15; margin-top: 6px; }
.contador .valor small { font-size: 16px; color: var(--muted); }
.contador .legenda { margin-top: auto; font-size: 13px; color: var(--muted); }
.painel { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); }
.painel h2 { font-size: 14px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: baseline; gap: 8px; }
.painel h2 .conta { font-weight: 400; color: var(--muted); }
.painel h2 .acao { margin-left: auto; font-weight: 500; }
.linhas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.linha-prova {
  display: grid; grid-template-columns: 1fr auto 140px; align-items: center; gap: 16px;
  min-height: 63px; padding: 10px 16px; border-radius: var(--radius-inner);
  background: var(--raised); border: 1px solid var(--border); cursor: pointer; text-align: left; width: 100%;
}
.linha-prova:hover { border-color: var(--control); }
.linha-prova .nome { font-weight: 500; }
.linha-prova .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.linha-prova .placar-prova { font-size: 14px; color: var(--muted); text-align: right; }
.trilho { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.trilho span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.topico {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--radius-inner); border: 1px solid transparent; background: none; cursor: pointer;
}
.topico:hover { background: var(--raised); }
.topico[aria-pressed="true"] { background: var(--raised); border-color: var(--accent); }
.topico .nome { font-size: 14px; }
.topico .pct { font-size: 14px; color: var(--muted); white-space: nowrap; }
.topico .trilho { grid-column: 1 / -1; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; }
.botao {
  height: var(--control-height); padding: 0 18px; border-radius: var(--radius-control);
  border: 1px solid var(--control); background: var(--ground); cursor: pointer; font-weight: 500; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
.botao:hover:not(:disabled) { border-color: var(--text); }
.botao.principal { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.botao:disabled { opacity: .45; cursor: default; }
.texto-painel { font-size: 14px; color: var(--text); margin: 0 0 10px; }
.texto-painel:last-child { margin-bottom: 0; }
.erros-lista { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.erros-lista a {
  display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; text-decoration: none;
  background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius-inner); font-size: 14px;
}
.erros-lista a:hover { border-color: var(--control); }
.erros-lista .meta { color: var(--muted); }

/* questão */
.topo-questao { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--muted); }
.topo-questao .trilho { flex: 1; }
.topo-questao .trilho span { background: var(--text); }
h1.titulo-questao { font: 400 32px/1.15 var(--serif); margin: 20px 0 0; }
.meta-questao { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.pilula { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }
.pilula.aviso { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
.questao {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px var(--gap); margin-top: 28px;
  grid-template-areas:
    "enun enun enun enun enun enun enun enun antes antes antes antes"
    "alts alts alts alts alts alts alts alts antes antes antes antes"
    "res  res  res  res  res  res  res  res  antes antes antes antes";
  grid-template-rows: auto auto 1fr;
  align-items: start;
}
.questao > * { min-width: 0; }
.enunciado { grid-area: enun; font-size: 17px; }
.antes { grid-area: antes; position: sticky; top: 16px; }
.alternativas { grid-area: alts; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.resultado { grid-area: res; }
.enunciado p { margin: 0 0 14px; }
.enunciado table, .porque table, .antes table { border-collapse: collapse; margin: 0 0 14px; font-size: 14px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
pre {
  max-width: 100%;
  background: var(--code-bg); border-radius: var(--radius-inner); padding: 14px 16px; overflow-x: auto;
  font: 14px/1.5 var(--mono); margin: 0 0 14px;
}
code { font-family: var(--mono); font-size: .9em; }
:not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.tok-k { color: var(--accent); font-weight: 600; }
.tok-c { color: var(--muted); font-style: italic; }
.tok-n { color: var(--text); }
.tok-s { color: var(--muted); }
.figuras { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 10px; }
.figura { background: #fff; border-radius: var(--radius-inner); padding: 8px; max-width: 100%; border: 1px solid var(--border); }
.figura img { display: block; max-width: 100%; height: auto; }
.original { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.aviso-q { background: var(--pill-warning-bg); color: var(--pill-warning-ink); border-radius: var(--radius-inner); padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }

/* antes de responder */
.antes details { background: var(--surface); border-radius: var(--radius-card); }
.antes summary {
  list-style: none; cursor: pointer; padding: 18px var(--pad); display: flex; align-items: baseline; gap: 8px;
  font-weight: 600; font-size: 15px;
}
.antes summary::-webkit-details-marker { display: none; }
.antes summary .estado { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
.antes .corpo { padding: 0 var(--pad) var(--pad); font-size: 15px; }
.antes .corpo p { margin: 0 0 12px; }
.antes .corpo ul { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.antes .corpo li { background: var(--raised); border-radius: var(--radius-inner); padding: 10px 12px; border: 1px solid var(--border); }
.antes pre { background: var(--raised); white-space: pre-wrap; overflow-wrap: anywhere; }
.ref {
  display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--accent);
  text-decoration: none; white-space: nowrap; font-weight: 500;
}
.ref:hover { text-decoration: underline; }
.ref .n { font-variant-numeric: tabular-nums; }
.conceito { display: flex; flex-direction: column; gap: 2px; }
.conceito .def { line-height: 1.5; }
.conceito .ex { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.conceito .ex-rot { font-weight: 600; color: var(--accent); margin-right: 4px; }
.conceito .refs { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.conceito .ref { white-space: normal; }
.conceito .ref::before { content: "Estude: "; color: var(--muted); font-weight: 400; }
.desenho { margin-top: 4px; }
.desenho summary { padding: 0; font-size: 14px; font-weight: 500; color: var(--muted); }
.desenho img { display: block; width: 100%; height: auto; background: #fff; border-radius: var(--radius-inner); margin-top: 10px; border: 1px solid var(--border); }

/* alternativas */
.alt { border: 1px solid var(--border); border-radius: var(--radius-inner); background: var(--ground); }
.alt:has(.escolher:hover:not(:disabled)) { border-color: var(--text); }
.escolher {
  width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start;
  border: 0; background: none; padding: 14px 16px; cursor: pointer; border-radius: var(--radius-inner); font-size: 16px;
}
.escolher:disabled { cursor: default; }
.letra {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--control); font-weight: 600; font-size: 14px;
}
.escolher .texto { flex: 1; min-width: 0; }
.escolher .texto p { margin: 0 0 6px; }
.escolher .texto p:last-child { margin: 0; }
.alt.certa { border-color: var(--positive); background: var(--pill-positive-bg); }
.alt.certa .letra { background: var(--positive); border-color: var(--positive); color: var(--ground); }
.alt.errada { border-color: var(--negative); background: var(--pill-negative-bg); }
.alt.errada .letra { background: var(--negative); border-color: var(--negative); color: var(--ground); }
.alt.neutra-escolhida { border-color: var(--pill-warning-ink); }
.porque { margin: 0 16px 0 58px; padding: 10px 0 14px; border-top: 1px solid var(--border); font-size: 15px; }
.porque p { margin: 0 0 6px; }
.porque .rotulo { font-weight: 600; }
.certa .porque .rotulo { color: var(--positive); }
.errada .porque .rotulo { color: var(--negative); }
.apagada .porque .rotulo { color: var(--muted); }
.veredito { font: 400 28px/1.2 var(--serif); margin: 8px 0 12px; }
.veredito.certo { color: var(--positive); }
.veredito.errado { color: var(--negative); }
.veredito.neutro { color: var(--pill-warning-ink); }
.ideia { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); font-size: 15px; }
.ideia h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
.ideia p { margin: 0 0 10px; }
.estude { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; }
.navegar { display: flex; gap: 10px; justify-content: space-between; margin-top: 28px; }
.atalhos { font-size: 13px; color: var(--muted); margin-top: 16px; }
kbd { font: 12px var(--font); border: 1px solid var(--control); border-radius: 4px; padding: 0 5px; }

/* resultado */
.grande { font-size: 32px; margin: 0; }

@media (max-width: 960px) {
  .s3, .s9, .s4, .s6, .s8 { grid-column: span 12; }
  .ct { grid-column: span 6; }
  .questao { grid-template-areas: "enun" "antes" "alts" "res"; grid-template-columns: 1fr; grid-template-rows: auto; }
  .antes { position: static; }
}
@media (max-width: 560px) {
  body { font-size: 15px; }
  .so-largo { display: none; }
  .so-curto { display: inline; }
  .contador { min-height: 0; padding: 14px 16px; }
  .contador .valor { font-size: 28px; }
  .contador .legenda { margin-top: 6px; }
  .painel { padding: 16px; }
  .painel h2 { flex-wrap: wrap; row-gap: 12px; }
  .painel h2 .acao { margin-left: 0; flex-basis: 100%; }
  .painel h2 .acao .botao { width: 100%; justify-content: center; }
  .linha-prova { grid-template-columns: auto 1fr; row-gap: 8px; column-gap: 12px; padding: 12px 14px; }
  .linha-prova .nome { grid-column: 1 / -1; }
  .linha-prova .placar-prova { white-space: nowrap; text-align: left; font-size: 13px; }
  h1.saudacao { font-size: 32px; }
  h1.titulo-questao { font-size: 24px; }
  main { padding-top: 28px; }
  .porque { margin-left: 16px; }
  .navegar .botao { flex: 1; justify-content: center; }
  .marca small { display: none; }
  .enunciado { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .alt, .botao, .linha-prova, .topico, .chave { transition: border-color .15s, background-color .15s; }
}
</style>
</head>
<body>
<div class="coluna">
  <header class="cabeca">
    <a class="marca" href="#" id="inicio" aria-label="Início do quiz">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="14" fill="var(--accent)"/><path d="M14 7v14M14 11l-5 5M14 11l5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      LPEDC <small>· provas PPGI</small>
    </a>
    <span class="espaco"></span>
    <button class="chave" id="modo-prova" type="button" aria-pressed="false" title="Modo prova: o conceito começa fechado"><span class="bola"></span><span class="so-largo">Modo prova</span><span class="so-curto">Prova</span></button>
    <button class="chave" id="tema" type="button" aria-label="Trocar tema claro ou escuro"><svg class="lua" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="so-largo">Tema</span></button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script src="quiz/questoes.js?v=66aa2e14"></script>
<script>
'use strict'
const REPO = 'https://github.com/jhollyfer/LPEDC/blob/main/'
const CHAVE = 'lpedc-quiz-v1'
const DIA_DA_PROVA = new Date('2026-11-27T08:00:00-04:00')
const TOPICOS = {
  1: 'Fundamentos', 2: 'Eficiência', 3: 'Lista, pilha e fila', 4: 'Árvores',
  5: 'Hash', 6: 'Busca', 7: 'Ordenação', 8: 'Grafos',
}
const PROVAS = window.PROVAS ?? []
const ASSUNTOS = window.ASSUNTOS ?? {}
const QUESTOES = PROVAS.flatMap((p) =>
  p.questoes.map((q) => ({
    ...q,
    id: `${p.slug}-q${String(q.numero).padStart(2, '0')}`,
    edital: p.edital, slug: p.slug, ano: p.ano, oficial: p.oficial,
    topicos: String(q.topico ?? '').split(/[^0-9]+/).filter(Boolean).map(Number),
  })),
)
const porId = new Map(QUESTOES.map((q) => [q.id, q]))
const valeNota = (q) => /^[A-E]$/.test(q.gabarito ?? '')

// ---------- memória do navegador (pode falhar em aba privada) ----------
const ler = (k, padrao) => { try { return JSON.parse(localStorage.getItem(k)) ?? padrao } catch { return padrao } }
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch { /* sem memória: segue sem salvar */ } }
let respostas = ler(CHAVE, {})
let modoProva = ler('lpedc-modo-prova', false)

// ---------- tema e modo prova ----------
const raiz = document.documentElement
const temaSalvo = ler('lpedc-tema', null)
if (temaSalvo) raiz.dataset.theme = temaSalvo
document.getElementById('tema').onclick = () => {
  const escuroAgora = raiz.dataset.theme === 'dark' || (!raiz.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)
  raiz.dataset.theme = escuroAgora ? 'light' : 'dark'
  gravar('lpedc-tema', raiz.dataset.theme)
}
const botaoProva = document.getElementById('modo-prova')
const pintarModo = () => botaoProva.setAttribute('aria-pressed', String(modoProva))
pintarModo()
botaoProva.onclick = () => {
  modoProva = !modoProva
  gravar('lpedc-modo-prova', modoProva)
  pintarModo()
  const d = document.querySelector('.antes details')
  if (d && !d.dataset.respondida) d.open = !modoProva
}

// ---------- assuntos do curso ----------
const linkAssunto = (num) => {
  const a = ASSUNTOS[num]
  if (!a) return `<span class="ref"><span class="n">${esc(num)}</span></span>`
  return `<a class="ref" href="${REPO}${encodeURI(a.modulo)}#${a.ancora}" target="_blank" rel="noopener"><span class="n">${esc(num)}</span> ${esc(a.titulo)}</a>`
}

// ---------- mini-markdown: parágrafo, lista, código, tabela, `inline`, **negrito**, [NNNN] ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const PALAVRAS = /\b(int|char|float|double|void|struct|return|if|else|while|for|do|switch|case|break|continue|typedef|NULL|sizeof|const|unsigned|long|static|def|class|self|in|range|print|len|and|or|not|None|True|False|elif|import|from|lambda|function|procedimento|fim|se|senão|então|enquanto|para|faça|retorne|início|algoritmo|var|inteiro|real|até|de)\b/g
function realcar(codigo) {
  const partes = codigo.split(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g)
  return partes.map((p, i) => {
    if (i % 2 === 1) {
      const comentario = p.startsWith('//') || p.startsWith('/*') || (p.startsWith('#') && !/^#\s*(include|define)/.test(p))
      return `<span class="${comentario ? 'tok-c' : 'tok-s'}">${esc(p)}</span>`
    }
    return esc(p).replace(PALAVRAS, '<span class="tok-k">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>')
  }).join('')
}
const emLinha = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[(\d{4})\]/g, (_, n) => linkAssunto(n))
function md(texto) {
  if (!texto) return ''
  // cerca de código colada no texto ("**Exemplo:** ```c") vai para a própria linha
  const linhas = String(texto).replace(/\r/g, '').replace(/([^\n])[ \t]*(```)/g, '$1\n$2').replace(/(```)[ \t]*([^\n`\w][^\n]*)/g, '$1\n$2').split('\n')
  const out = []
  let par = []
  const fecharPar = () => { if (par.length) out.push(`<p>${par.map(emLinha).join('<br>')}</p>`); par = [] }
  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i]
    if (/^```/.test(l.trim())) {
      fecharPar()
      const corpo = []
      for (i++; i < linhas.length && !/^```/.test(linhas[i].trim()); i++) corpo.push(linhas[i])
      out.push(`<pre><code>${realcar(corpo.join('\n'))}</code></pre>`)
      continue
    }
    if (/^\s*[-*] /.test(l)) {
      fecharPar()
      const itens = []
      for (; i < linhas.length && /^\s*[-*] /.test(linhas[i]); i++) itens.push(linhas[i].replace(/^\s*[-*] /, ''))
      i--
      // conceito: "**Nome** [NNNN]: definição" vira nome, definição e o link do assunto embaixo
      out.push(`<ul>${itens.map((t) => {
        const m = t.match(/^\*\*(.+?)\*\*\s*((?:\[\d{4}\][,\s]*)+):\s*(.*)$/)
        if (!m) return `<li>${emLinha(t)}</li>`
        const refs = [...m[2].matchAll(/\d{4}/g)].map((x) => linkAssunto(x[0])).join('')
        const [def, ex] = m[3].split(/\s*Ex\.:\s*/)
        return `<li class="conceito"><strong>${emLinha(m[1])}</strong><span class="def">${emLinha(def)}</span>${ex ? `<span class="ex"><span class="ex-rot">Exemplo</span> ${emLinha(ex)}</span>` : ''}<span class="refs">${refs}</span></li>`
      }).join('')}</ul>`)
      continue
    }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      fecharPar()
      const tab = []
      for (; i < linhas.length && /^\s*\|.*\|\s*$/.test(linhas[i]); i++) tab.push(linhas[i])
      i--
      const celulas = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim())
      const corpo = tab.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r))
      const temCabecalho = tab.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(tab[1])
      const html = corpo.map((r, k) => {
        const tag = temCabecalho && k === 0 ? 'th' : 'td'
        return `<tr>${celulas(r).map((c) => `<${tag}>${emLinha(c)}</${tag}>`).join('')}</tr>`
      }).join('')
      out.push(`<table>${html}</table>`)
      continue
    }
    if (!l.trim()) { fecharPar(); continue }
    par.push(l)
  }
  fecharPar()
  return out.join('')
}

const figura = (nome, alt) => `<div class="figura"><img src="quiz/figuras/${encodeURIComponent(nome)}.svg" alt="${esc(alt)}" loading="lazy" onload="this.width=Math.round(this.naturalWidth*0.55)"></div>`
const doisDigitos = (n) => String(n).padStart(2, '0')
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0)

// ---------- estado da rodada ----------
let rodada = null // { titulo, ids, i }

function embaralhar(v) {
  const a = [...v]
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
  return a
}
function iniciar(titulo, ids) {
  if (!ids.length) { alert('Nenhuma questão nesse filtro.'); return }
  rodada = { titulo, ids, i: 0 }
  location.hash = `q/${ids[0]}`
}

// ---------- início ----------
let filtroTopicos = new Set(ler('lpedc-topicos', []))

function telaInicial() {
  rodada = null
  const app = document.getElementById('app')
  const contam = QUESTOES.filter(valeNota)
  const feitas = contam.filter((q) => respostas[q.id])
  const certas = feitas.filter((q) => respostas[q.id].certo)
  const erradas = feitas.filter((q) => !respostas[q.id].certo)
  const naoVistas = QUESTOES.filter((q) => !respostas[q.id])
  const dias = Math.max(0, Math.ceil((DIA_DA_PROVA - new Date()) / 86400000))
  const comFiltro = (lista) => lista.filter((q) => !filtroTopicos.size || q.topicos.some((t) => filtroTopicos.has(t)))
  const filtradas = comFiltro(QUESTOES)
  let saudacao = `Faltam ${dias} dias para a prova do PPGI.`
  if (dias === 1) saudacao = 'Falta 1 dia para a prova do PPGI.'
  if (dias === 0) saudacao = 'Hoje é a prova do PPGI. Boa prova.'

  const topicoLinha = ([n, nome]) => {
    const qs = contam.filter((q) => q.topicos.includes(Number(n)))
    const f = qs.filter((q) => respostas[q.id])
    const c = f.filter((q) => respostas[q.id].certo).length
    const legenda = f.length ? `${c} de ${f.length} · ${pct(c, f.length)}%` : `${qs.length} questões`
    return `<button class="topico" data-t="${n}" aria-pressed="${filtroTopicos.has(Number(n))}">
      <span class="nome">${n} · ${esc(nome)}</span><span class="pct num">${legenda}</span>
      <span class="trilho"><span style="width:${f.length ? pct(c, f.length) : 0}%"></span></span>
    </button>`
  }

  app.innerHTML = `
    <h1 class="saudacao">${saudacao}</h1>
    <p class="linha-cinza">${QUESTOES.length} questões das 11 provas de 2016 a 2023, com gabarito oficial. Leia o conceito, responda e veja o porquê de cada alternativa.</p>

    <section class="grade" aria-label="Seu andamento">
      <div class="contador s3 ct"><span class="rotulo">Respondidas</span><span class="valor num">${feitas.length} <small>de ${contam.length}</small></span><span class="legenda">${contam.length - feitas.length} ainda por fazer</span></div>
      <div class="contador s3 ct"><span class="rotulo">Acerto</span><span class="valor num">${feitas.length ? `${pct(certas.length, feitas.length)}%` : '–'}</span><span class="legenda">${feitas.length ? `${certas.length} certas` : 'Responda a primeira para ver'}</span></div>
      <div class="contador s3 ct"><span class="rotulo">Para refazer</span><span class="valor num">${erradas.length}</span><span class="legenda">${erradas.length ? 'questões que você errou' : 'Nenhum erro guardado'}</span></div>
      <div class="contador s3 ct"><span class="rotulo">Anuladas e sem nota</span><span class="valor num">${QUESTOES.length - contam.length}</span><span class="legenda">valem pela explicação</span></div>

      <section class="painel s9" aria-labelledby="t-provas">
        <h2 id="t-provas">Provas <span class="conta num">${PROVAS.length}</span><span class="acao"><button class="botao principal" id="todas">Todas embaralhadas${filtroTopicos.size ? ` · ${filtradas.length}` : ''}</button></span></h2>
        <ul class="linhas">
          ${PROVAS.map((p) => {
            const qs = QUESTOES.filter((q) => q.slug === p.slug)
            const val = qs.filter(valeNota)
            const f = val.filter((q) => respostas[q.id])
            const c = f.filter((q) => respostas[q.id].certo).length
            return `<li><button class="linha-prova" data-slug="${p.slug}">
              <span class="nome">Edital ${esc(p.edital)}<span class="sub">${qs.length} questões · ${qs[0]?.alternativas.length ?? 0} alternativas</span></span>
              <span class="placar-prova num">${f.length ? `${c} de ${f.length} certas` : 'não começada'}</span>
              <span class="trilho" aria-hidden="true"><span style="width:${pct(c, val.length)}%"></span></span>
            </button></li>`
          }).join('')}
        </ul>
      </section>

      <section class="painel s3 tp" aria-labelledby="t-topicos">
        <h2 id="t-topicos">Acerto por tópico</h2>
        <p class="texto-painel" style="color:var(--muted)">Toque para filtrar as provas e as embaralhadas.</p>
        ${Object.entries(TOPICOS).map(topicoLinha).join('')}
      </section>

      <section class="painel s6" aria-labelledby="t-erros">
        <h2 id="t-erros">Para refazer <span class="conta num">${erradas.length}</span>${erradas.length ? '<span class="acao"><button class="botao" id="erros">Refazer todas</button></span>' : ''}</h2>
        ${erradas.length
          ? `<ul class="erros-lista">${erradas.slice(0, 5).map((q) => `<li><a href="#q/${q.id}"><span>Edital ${esc(q.edital)} · questão ${doisDigitos(q.numero)}</span><span class="meta num">marcou ${esc(respostas[q.id].escolha)}, era ${esc(q.gabarito)}</span></a></li>`).join('')}</ul>${erradas.length > 5 ? `<p class="texto-painel" style="margin-top:10px;color:var(--muted)">e mais ${erradas.length - 5}.</p>` : ''}`
          : '<p class="texto-painel" style="color:var(--muted)">As questões que você errar aparecem aqui, para refazer depois de estudar o assunto.</p>'}
      </section>

      <section class="painel s6" aria-labelledby="t-como">
        <h2 id="t-como">Como estudar com o quiz</h2>
        <p class="texto-painel">Antes de responder, leia o painel <strong>Antes de responder</strong>: o que a questão cobra, os conceitos com o assunto do curso onde cada um é ensinado e um exemplo com outros dados.</p>
        <p class="texto-painel">Depois, cada alternativa mostra por que está certa ou errada. Para treinar como na prova, ligue o <strong>Modo prova</strong>: o conceito começa fechado.</p>
        <div class="acoes"><button class="botao" id="novas" ${naoVistas.length ? '' : 'disabled'}>Só as que não fiz · ${naoVistas.length}</button><button class="botao" id="zerar" ${Object.keys(respostas).length ? '' : 'disabled'}>Zerar progresso</button></div>
      </section>
    </section>
  `
  app.querySelector('#todas').onclick = () => iniciar('Todas embaralhadas', embaralhar(filtradas).map((q) => q.id))
  app.querySelector('#novas').onclick = () => iniciar('Só as que não fiz', embaralhar(comFiltro(naoVistas)).map((q) => q.id))
  const be = app.querySelector('#erros')
  if (be) be.onclick = () => iniciar('As que errei', embaralhar(erradas).map((q) => q.id))
  app.querySelectorAll('.linha-prova').forEach((b) => {
    b.onclick = () => {
      const p = PROVAS.find((x) => x.slug === b.dataset.slug)
      iniciar(`Edital ${p.edital}`, comFiltro(QUESTOES.filter((q) => q.slug === p.slug)).map((q) => q.id))
    }
  })
  app.querySelectorAll('.topico').forEach((c) => {
    c.onclick = () => {
      const t = Number(c.dataset.t)
      if (filtroTopicos.has(t)) filtroTopicos.delete(t)
      else filtroTopicos.add(t)
      gravar('lpedc-topicos', [...filtroTopicos])
      telaInicial()
    }
  })
  app.querySelector('#zerar').onclick = () => {
    if (!confirm('Apagar todas as suas respostas salvas neste navegador?')) return
    respostas = {}
    gravar(CHAVE, respostas)
    telaInicial()
  }
  window.scrollTo(0, 0)
}

// ---------- questão ----------
function painelAntes(q, respondida) {
  if (!q.dica) return ''
  const nums = [...new Set([...(q.dica.matchAll(/\[(\d{4})\]/g))].map((m) => m[1]))]
  const comDesenho = nums.find((n) => ASSUNTOS[n]?.ideia)
  const aberto = respondida || !modoProva
  return `<details ${aberto ? 'open' : ''} ${respondida ? 'data-respondida="1"' : ''}>
    <summary>Antes de responder <span class="estado">${modoProva && !respondida ? 'modo prova · H abre' : 'H fecha'}</span></summary>
    <div class="corpo">
      ${md(q.dica)}
      ${comDesenho ? `<details class="desenho"><summary>Ver o desenho do assunto ${esc(comDesenho)}</summary><img src="material/${comDesenho}-ideia.svg" alt="Diagrama da ideia do assunto ${esc(comDesenho)}: ${esc(ASSUNTOS[comDesenho].titulo)}" loading="lazy"></details>` : ''}
    </div>
  </details>`
}

function telaQuestao(id) {
  const q = porId.get(id)
  if (!q) { location.hash = ''; return }
  if (!rodada || !rodada.ids.includes(id)) rodada = { titulo: `Edital ${q.edital}`, ids: QUESTOES.filter((x) => x.slug === q.slug).map((x) => x.id), i: 0 }
  rodada.i = rodada.ids.indexOf(id)
  const salva = respostas[id]
  const respondida = Boolean(salva)
  const app = document.getElementById('app')
  const total = rodada.ids.length
  const topicos = q.topicos.map((t) => `${t} · ${TOPICOS[t] ?? ''}`).join(', ')
  let aviso = ''
  if (q.gabarito === 'anulada') aviso = '<div class="aviso-q">Questão anulada pela banca. Responda mesmo assim: a análise mostra o que está certo e errado em cada alternativa. Não conta no placar.</div>'
  else if (!valeNota(q)) aviso = '<div class="aviso-q">Questão sem letra definida. Vale pela análise; não conta no placar.</div>'
  const figs = (q.figuras ?? []).map((f) => figura(f, `figura da questão ${q.numero}`)).join('')
  const originais = (q.originais ?? []).map((o, k) => `<a href="${esc(o)}" target="_blank" rel="noopener">ver original${q.originais.length > 1 ? ` ${k + 1}` : ''}</a>`).join(' · ')

  app.innerHTML = `
    <div class="topo-questao">
      <span class="num">${esc(rodada.titulo)} · ${rodada.i + 1} de ${total}</span>
      <span class="trilho" aria-hidden="true"><span style="width:${pct(rodada.i + 1, total)}%"></span></span>
    </div>
    <h1 class="titulo-questao">Edital ${esc(q.edital)}<span class="so-largo">, questão ${doisDigitos(q.numero)}</span><span class="so-curto"> · Q${doisDigitos(q.numero)}</span></h1>
    <p class="meta-questao">${esc(q.formato ?? '')}${topicos ? ` · tópico ${esc(topicos)}` : ''} ${q.gabarito === 'anulada' ? '<span class="pilula aviso">anulada</span>' : ''}</p>
    <div class="questao">
      <div class="enunciado">
        ${aviso}
        ${md(q.enunciado)}
        ${figs ? `<div class="figuras">${figs}</div>` : ''}
        ${originais ? `<p class="original">Recorte da prova: ${originais}</p>` : ''}
      </div>
      <aside class="antes" aria-label="Antes de responder">${painelAntes(q, respondida)}</aside>
      <ul class="alternativas" role="list">
        ${q.alternativas.map((a, k) => `
          <li class="alt" data-letra="${esc(a.letra)}">
            <button class="escolher" ${respondida ? 'disabled' : ''} aria-keyshortcuts="${k + 1} ${a.letra}">
              <span class="letra">${esc(a.letra)}</span>
              <span class="texto">${md(a.texto)}${a.figura ? figura(a.figura, `alternativa ${a.letra}`) : ''}</span>
            </button>
            <div class="porque" hidden></div>
          </li>`).join('')}
      </ul>
      <div class="resultado" id="resultado"></div>
    </div>
    <nav class="navegar" aria-label="Navegar entre questões">
      <button class="botao" id="anterior" ${rodada.i ? '' : 'disabled'}>Anterior</button>
      <button class="botao" id="voltar">Provas</button>
      <button class="botao principal" id="proxima">${rodada.i + 1 < total ? 'Próxima' : 'Ver resultado'}</button>
    </nav>
    <p class="atalhos"><kbd>A</kbd> a <kbd>E</kbd> ou <kbd>1</kbd> a <kbd>5</kbd> responde · <kbd>H</kbd> abre ou fecha o conceito · <kbd>←</kbd> <kbd>→</kbd> navegam</p>
  `
  app.querySelectorAll('.alt').forEach((li) => { li.querySelector('.escolher').onclick = () => responder(q, li.dataset.letra) })
  app.querySelector('#anterior').onclick = () => irPara(rodada.i - 1)
  app.querySelector('#proxima').onclick = () => irPara(rodada.i + 1)
  app.querySelector('#voltar').onclick = () => { location.hash = '' }
  if (respondida) mostrarAnalise(q, salva.escolha)
  window.scrollTo(0, 0)
}

function responder(q, letra) {
  if (respostas[q.id]) return
  respostas[q.id] = { escolha: letra, certo: q.gabarito === letra, quando: Date.now() }
  gravar(CHAVE, respostas)
  mostrarAnalise(q, letra)
  const d = document.querySelector('.antes details')
  if (d) { d.dataset.respondida = '1'; d.open = true }
}

function mostrarAnalise(q, escolha) {
  const app = document.getElementById('app')
  const nota = valeNota(q)
  app.querySelectorAll('.alt').forEach((b) => {
    b.querySelector('.escolher').disabled = true
    const a = q.alternativas.find((x) => x.letra === b.dataset.letra)
    const correta = nota && a.letra === q.gabarito
    const escolhida = a.letra === escolha
    if (correta) b.classList.add('certa')
    else if (escolhida && nota) b.classList.add('errada')
    else b.classList.add('apagada')
    if (escolhida && !nota) b.classList.add('neutra-escolhida')
    let rotulo = 'Por que não'
    if (correta) rotulo = escolhida ? 'Você acertou. Por quê' : 'Esta é a certa. Por quê'
    else if (escolhida && nota) rotulo = 'Sua escolha. Por que está errada'
    else if (!nota) rotulo = escolhida ? 'Sua escolha. Análise' : 'Análise'
    const p = b.querySelector('.porque')
    p.innerHTML = `<p><span class="rotulo">${rotulo}:</span></p>${md(a.porque)}`
    p.hidden = false
  })
  let veredito = ''
  if (!nota) veredito = `<p class="veredito neutro">${q.gabarito === 'anulada' ? 'Questão anulada' : 'Sem letra definida'}: você marcou ${esc(escolha)}.</p>`
  else if (escolha === q.gabarito) veredito = '<p class="veredito certo">Certo.</p>'
  else veredito = `<p class="veredito errado">Errado: você marcou ${esc(escolha)}, a resposta é ${esc(q.gabarito)}.</p>`
  const estude = (q.assuntos ?? []).map((s) => linkAssunto(s.num)).join('')
  app.querySelector('#resultado').innerHTML = `
    ${veredito}
    <section class="ideia" aria-labelledby="t-ideia">
      <h2 id="t-ideia">A ideia da questão</h2>
      ${md(q.resumo)}
      ${estude ? `<div class="estude">${estude}</div>` : ''}
    </section>`
}

function irPara(i) {
  if (i < 0) return
  if (i >= rodada.ids.length) { location.hash = 'fim'; return }
  location.hash = `q/${rodada.ids[i]}`
}

// ---------- resultado da rodada ----------
function telaFim() {
  if (!rodada) { location.hash = ''; return }
  const qs = rodada.ids.map((id) => porId.get(id))
  const contam = qs.filter((q) => valeNota(q) && respostas[q.id])
  const certas = contam.filter((q) => respostas[q.id].certo)
  const erradas = contam.filter((q) => !respostas[q.id].certo)
  const assuntos = [...new Set(erradas.flatMap((q) => (q.assuntos ?? []).map((s) => s.num)))]
  const app = document.getElementById('app')
  app.innerHTML = `
    <h1 class="saudacao">${certas.length} de ${contam.length} certas em ${esc(rodada.titulo.toLowerCase())}.</h1>
    <p class="linha-cinza">${pct(certas.length, contam.length)}% de acerto nas questões que valem nota${qs.length - contam.length ? ` · ${qs.length - contam.length} sem nota (anuladas, sem letra ou puladas)` : ''}.</p>
    <section class="grade">
      <section class="painel s6" aria-labelledby="t-rev">
        <h2 id="t-rev">Revise estas <span class="conta num">${erradas.length}</span></h2>
        ${erradas.length ? `<ul class="erros-lista">${erradas.map((q) => `<li><a href="#q/${q.id}"><span>Edital ${esc(q.edital)} · questão ${doisDigitos(q.numero)}</span><span class="meta num">marcou ${esc(respostas[q.id].escolha)}, era ${esc(q.gabarito)}</span></a></li>`).join('')}</ul>` : '<p class="texto-painel">Nenhum erro nesta rodada.</p>'}
      </section>
      <section class="painel s6" aria-labelledby="t-ass">
        <h2 id="t-ass">Assuntos para reforçar <span class="conta num">${assuntos.length}</span></h2>
        ${assuntos.length ? `<div class="estude" style="flex-direction:column;gap:10px">${assuntos.map(linkAssunto).join('')}</div>` : '<p class="texto-painel">Nada a reforçar nesta rodada.</p>'}
        <div class="acoes" style="margin-top:16px">
          ${erradas.length ? '<button class="botao principal" id="refazer">Refazer as erradas</button>' : ''}
          <button class="botao" id="voltar">Voltar às provas</button>
        </div>
      </section>
    </section>`
  const refazer = app.querySelector('#refazer')
  if (refazer) refazer.onclick = () => {
    for (const q of erradas) delete respostas[q.id]
    gravar(CHAVE, respostas)
    iniciar(`${rodada.titulo} · erradas`, erradas.map((q) => q.id))
  }
  app.querySelector('#voltar').onclick = () => { location.hash = '' }
  window.scrollTo(0, 0)
}

// ---------- rotas e teclado ----------
function rotear() {
  const h = location.hash.slice(1)
  if (h.startsWith('q/')) telaQuestao(h.slice(2))
  else if (h === 'fim') telaFim()
  else telaInicial()
}
window.addEventListener('hashchange', rotear)
document.getElementById('inicio').onclick = (e) => { e.preventDefault(); location.hash = '' }
document.addEventListener('keydown', (e) => {
  if (!location.hash.startsWith('#q/') || e.ctrlKey || e.metaKey || e.altKey) return
  if (e.target.closest && e.target.closest('input, textarea')) return
  const q = porId.get(location.hash.slice(3))
  if (!q) return
  if (e.key === 'ArrowRight') return irPara(rodada.i + 1)
  if (e.key === 'ArrowLeft') return irPara(rodada.i - 1)
  const k = e.key.toUpperCase()
  if (k === 'H') { const d = document.querySelector('.antes details'); if (d) d.open = !d.open; return }
  const porNumero = /^[1-5]$/.test(k) ? q.alternativas[Number(k) - 1]?.letra : null
  const letra = porNumero ?? (q.alternativas.some((a) => a.letra === k) ? k : null)
  if (letra) responder(q, letra)
})
rotear()
</script>
