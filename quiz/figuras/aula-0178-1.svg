<svg xmlns="http://www.w3.org/2000/svg" width="382" height="290" viewBox="0 0 382 290">
<title>k mod 16</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="382" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">k mod 16</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start"> k   k = 16·q + r    r</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">16   16·1  + 0       0</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">32   16·2  + 0       0</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">48   16·3  + 0       0</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">64   16·4  + 0       0</text>
</svg>
