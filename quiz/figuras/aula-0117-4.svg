<svg xmlns="http://www.w3.org/2000/svg" width="455" height="218" viewBox="0 0 455 218">
<title>2^h &gt;= 3!</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="455" height="218" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">2^h &gt;= 3!</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">altura 2: até 4 folhas &lt; 6</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">altura 3: até 8 folhas &gt;= 6</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">logo h &gt;= 3</text>
</svg>
