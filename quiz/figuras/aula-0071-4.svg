<svg xmlns="http://www.w3.org/2000/svg" width="396" height="326" viewBox="0 0 396 326">
<title>caso médio</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="396" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">caso médio</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">pos:    0 1 2 3 4 5 6 7</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">passos: 1 2 3 4 5 6 7 8</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">soma = 36</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">média = 36 / 8 = 4,5</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">fórmula: (n + 1) / 2</text>
</svg>
