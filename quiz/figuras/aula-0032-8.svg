<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">T(1) = 1</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">T(2) = 2 · 1 + 1 = 3</text>
