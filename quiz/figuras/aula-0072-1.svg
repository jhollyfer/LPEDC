<svg xmlns="http://www.w3.org/2000/svg" width="513" height="326" viewBox="0 0 513 326">
<title>O(1)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="513" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">O(1)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">x = v[i];       // 1 passo</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">topo = p[--t];  // pop: 1 passo</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">n = 8   -&gt; 1 passo</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">n = 16  -&gt; 1 passo</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n dobrou: o custo ficou igual</text>
</svg>
