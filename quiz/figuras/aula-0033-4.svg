<svg xmlns="http://www.w3.org/2000/svg" width="367" height="286" viewBox="0 0 367 286">
<title>aula-0033-4</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="367" height="286" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">C(0) = 1</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">C(1) = 1</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">C(2) = 1 + 1 + 1 = 3</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">C(3) = 3 + 1 + 1 = 5</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">C(4) = 5 + 3 + 1 = 9</text>
<text x="30" y="240" font-size="24" fill="#1e1e1e" text-anchor="start">C(5) = 9 + 5 + 1 = 15</text>
</svg>
