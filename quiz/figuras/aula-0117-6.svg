<svg xmlns="http://www.w3.org/2000/svg" width="440" height="218" viewBox="0 0 440 218">
<title>o piso</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="440" height="218" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">o piso</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">n! &gt;= (n/2)^(n/2)</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">log2 n! &gt;= (n/2)·log2(n/2)</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">h = Ω(n log n)</text>
</svg>
