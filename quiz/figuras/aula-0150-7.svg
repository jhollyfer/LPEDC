<svg xmlns="http://www.w3.org/2000/svg" width="455" height="434" viewBox="0 0 455 434">
<title>regra do pai</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="455" height="434" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">regra do pai</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">A - B</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start"> \ |</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">   C</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">A -&gt; B (pai A)</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">B vê A: é o pai, ignora</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">B -&gt; C (pai B)</text>
<text x="30" y="352" font-size="24" fill="#1e1e1e" text-anchor="start">C vê A: visitado, não é pai</text>
<text x="30" y="388" font-size="24" fill="#1e1e1e" text-anchor="start">=&gt; ciclo A, B, C</text>
</svg>
