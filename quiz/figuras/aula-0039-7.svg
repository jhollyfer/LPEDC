<svg xmlns="http://www.w3.org/2000/svg" width="484" height="290" viewBox="0 0 484 290">
<title>C = A . B</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="484" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">C = A . B</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">c[1][0] = 0*2 + 1*0 + 3*1 = 3</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">c[1][1] = 0*1 + 1*1 + 3*0 = 1</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">C = | 2  3 |</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">    | 3  1 |</text>
</svg>
