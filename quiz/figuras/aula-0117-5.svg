<svg xmlns="http://www.w3.org/2000/svg" width="411" height="254" viewBox="0 0 411 254">
<title>h &gt;= log2(n!)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="411" height="254" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">h &gt;= log2(n!)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">n=3:  3! = 6     h &gt;= 3</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">n=4:  4! = 24    h &gt;= 5</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">n=5:  5! = 120   h &gt;= 7</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">n=10: 3.628.800  h &gt;= 22</text>
</svg>
