<svg xmlns="http://www.w3.org/2000/svg" width="484" height="362" viewBox="0 0 484 362">
<title>f quadrática, g log</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="484" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">f quadrática, g log</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start"> n    f = n²-1   g = 8log n+1</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start"> 8        63          25</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">16       255          33</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">64     4.095          49</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">g é O(f)    f é Ω(g)</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">f não é O(g)</text>
</svg>
