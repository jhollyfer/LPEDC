<svg xmlns="http://www.w3.org/2000/svg" width="484" height="326" viewBox="0 0 484 326">
<title>T(n) = 2T(n/2) + 1</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="484" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">T(n) = 2T(n/2) + 1</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">nível 0:         1        = 1</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">nível 1:     1       1    = 2</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">nível 2:   1   1   1   1  = 4</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">nível 3:  1 1 1 1 1 1 1 1 = 8</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">total = 15 = 2n - 1: Θ(n)</text>
</svg>
