<svg xmlns="http://www.w3.org/2000/svg" width="367" height="362" viewBox="0 0 367 362">
<title>T(n) = T(n-1) + n</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="367" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">T(n) = T(n-1) + n</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">T(4)  -&gt; 4</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start"> T(3) -&gt; 3</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">  T(2) -&gt; 2</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">   T(1) -&gt; 1</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">total = 10 = n(n+1)/2</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">Θ(n²)</text>
</svg>
