<svg xmlns="http://www.w3.org/2000/svg" width="455" height="250" viewBox="0 0 455 250">
<title>aula-0007-4</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="455" height="250" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">10 + 7 / 2 * 3 % 4</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">10 + 3 * 3 % 4      7/2 = 3</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">10 + 9 % 4          3*3 = 9</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">10 + 1              9%4 = 1</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">x = 11</text>
</svg>
