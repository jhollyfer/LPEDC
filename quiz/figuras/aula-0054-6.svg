<svg xmlns="http://www.w3.org/2000/svg" width="557" height="254" viewBox="0 0 557 254">
<title>bytes, não itens</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="557" height="254" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">bytes, não itens</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">pedido:  malloc(3)       3 bytes</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">preciso: 3 * sizeof(int)  12 bytes</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">0x6000: [ w[0]? ] | fora...</text>
</svg>
