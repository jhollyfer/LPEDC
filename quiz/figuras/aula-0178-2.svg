<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">16 = 0001 0000</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">32 = 0010 0000</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">48 = 0011 0000</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">64 = 0100 0000</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">          ^^^^</text>
<text x="30" y="240" font-size="24" fill="#1e1e1e" text-anchor="start">  k % 16 = 0000</text>
</svg>
