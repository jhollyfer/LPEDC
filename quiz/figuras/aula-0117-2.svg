<svg xmlns="http://www.w3.org/2000/svg" width="484" height="182" viewBox="0 0 484 182">
<title>uma pergunta</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="484" height="182" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">uma pergunta</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">A&gt;B? não: A B C, A C B, C A B</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">A&gt;B? sim: B A C, B C A, C B A</text>
</svg>
