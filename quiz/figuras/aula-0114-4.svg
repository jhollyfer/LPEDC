<svg xmlns="http://www.w3.org/2000/svg" width="382" height="326" viewBox="0 0 382 326">
<title>T(n) = 2T(n/2) + n</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="382" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">T(n) = 2T(n/2) + n</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">níveis: log2 n + 1 = 4</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">cada nível: n = 8</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">total = 8 · 4 = 32</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">      = n log n + n</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">      = Θ(n log n)</text>
</svg>
