<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">n     1  2  3  4  5  6  7</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">f(n)  0  1  1  2  3  5  8</text>
