<svg xmlns="http://www.w3.org/2000/svg" width="281" height="218" viewBox="0 0 281 218">
<title>3! = 6 folhas</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="281" height="218" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">3! = 6 folhas</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">A B C    A C B</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">B A C    B C A</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">C A B    C B A</text>
</svg>
