<svg xmlns="http://www.w3.org/2000/svg" width="440" height="362" viewBox="0 0 440 362">
<title>O(n²)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="440" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">O(n²)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">3n² + 10n + 20 &lt;= 4n²</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">      n² - 10n - 20 &gt;= 0</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">raiz: (10 + √180)/2 = 11,7</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">n = 11: 493 &gt; 484   falha</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n = 12: 572 &lt;= 576  vale</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">c = 4, n0 = 12</text>
</svg>
