<rect x="0" y="0" width="542" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">a cópia esquecida</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">a = NULL</text>
