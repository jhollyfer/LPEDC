<svg xmlns="http://www.w3.org/2000/svg" width="382" height="290" viewBox="0 0 382 290">
<title>k mod 13</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="382" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">k mod 13</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start"> k   k = 13·q + r    r</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">16   13·1  + 3       3</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">32   13·2  + 6       6</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">48   13·3  + 9       9</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">64   13·4  + 12     12</text>
</svg>
