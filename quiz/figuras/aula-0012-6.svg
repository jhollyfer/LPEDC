<svg xmlns="http://www.w3.org/2000/svg" width="455" height="214" viewBox="0 0 455 214">
<title>aula-0012-6</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="455" height="214" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">int flag = 0;</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">... achou: flag = 1;</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">if (flag)   -&gt; 1: entra</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">if (!flag)  -&gt; 0: não entra</text>
</svg>
