<svg xmlns="http://www.w3.org/2000/svg" width="411" height="250" viewBox="0 0 411 250">
<title>aula-0022-5</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="411" height="250" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">i = 0; i &lt; 6        -&gt; 6</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">i = 1; i &lt;= 6       -&gt; 6</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">i = 1; i &lt; 6        -&gt; 5</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">i = 0; i &lt; 10; i+=3 -&gt; 4</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">i = 5; i &lt; 5        -&gt; 0</text>
</svg>
