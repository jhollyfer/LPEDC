<svg xmlns="http://www.w3.org/2000/svg" width="367" height="290" viewBox="0 0 367 290">
<title>Ω(n²)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="367" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">Ω(n²)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">3n² + 10n + 20 &gt;= 3n²</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">      10n + 20 &gt;= 0</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">vale para todo n &gt;= 1</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">c = 3, n0 = 1</text>
</svg>
