<svg xmlns="http://www.w3.org/2000/svg" width="382" height="286" viewBox="0 0 382 286">
<title>aula-0023-5</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="382" height="286" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">for i = 0..2</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">  for j = 0..3</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">    if (j == 2) break;</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">    imprime i,j</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="240" font-size="24" fill="#1e1e1e" text-anchor="start">00 01 / 10 11 / 20 21</text>
</svg>
