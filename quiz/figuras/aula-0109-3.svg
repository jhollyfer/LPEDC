<svg xmlns="http://www.w3.org/2000/svg" width="382" height="290" viewBox="0 0 382 290">
<title>V listas, 2E nós</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="382" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">V listas, 2E nós</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">0 Centro : 1 -&gt; 2</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">1 Praia  : 0 -&gt; 2</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">2 Feira  : 0 -&gt; 1 -&gt; 3</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">3 Parque : 2 -&gt; 4</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">4 Estadio: 3</text>
</svg>
