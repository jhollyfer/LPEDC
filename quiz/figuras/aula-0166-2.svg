<svg xmlns="http://www.w3.org/2000/svg" width="417" height="326" viewBox="0 0 417 326">
<title>c e n0 não são únicos</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="417" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">c e n0 não são únicos</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">c = 4    -&gt; n0 = 12</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">c = 3,5  -&gt; n0 = 22</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">c = 3    -&gt; nenhum n0</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">3n² &lt; 3n² + 10n + 20</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">para todo n</text>
</svg>
