<svg xmlns="http://www.w3.org/2000/svg" width="411" height="254" viewBox="0 0 411 254">
<title>while</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="411" height="254" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">while</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">i = 5</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">5 == 5?  sim -&gt; continue</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">volta para: i &lt; 10?</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">i++ pulado</text>
</svg>
