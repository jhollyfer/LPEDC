<svg xmlns="http://www.w3.org/2000/svg" width="484" height="254" viewBox="0 0 484 254">
<title>dobra o número de nós</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="484" height="254" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">dobra o número de nós</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">nível 0:         8        = 8</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">nível 1:     4       4    = 8</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">            / \     / \</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">          T(2)T(2) T(2)T(2)</text>
</svg>
