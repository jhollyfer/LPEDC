<svg xmlns="http://www.w3.org/2000/svg" width="352" height="250" viewBox="0 0 352 250">
<title>aula-0032-7</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="352" height="250" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">T(1) = 1</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">T(2) = 2 · T(1) + 1</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">     = 2 · 1 + 1 = 3</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">T(5) = 2 · T(2) + 1</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">     = 2 · 3 + 1 = 7</text>
</svg>
