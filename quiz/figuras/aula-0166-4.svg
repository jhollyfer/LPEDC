<svg xmlns="http://www.w3.org/2000/svg" width="396" height="290" viewBox="0 0 396 290">
<title>Θ(n²)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="396" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">Θ(n²)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">3n² &lt;= f(n) &lt;= 4n²</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">para todo n &gt;= 12</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">c1 = 3, c2 = 4, n0 = 12</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">f(n) é Θ(n²)</text>
</svg>
