<svg xmlns="http://www.w3.org/2000/svg" width="528" height="214" viewBox="0 0 528 214">
<title>aula-0033-7</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="528" height="214" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">mdc(1071, 462)  1071 % 462 = 147</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">mdc(462, 147)   462 % 147 = 21</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">mdc(147, 21)    147 % 21 = 0</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">mdc(21, 0)      -&gt; 21</text>
</svg>
