<svg xmlns="http://www.w3.org/2000/svg" width="367" height="322" viewBox="0 0 367 322">
<title>aula-0028-4</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="367" height="322" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">fatorial(3)</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">  else: fatorial(2)</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">    else: fatorial(1)</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">      return 1</text>
<text x="30" y="204" font-size="24" fill="#1e1e1e" text-anchor="start">    (descarta o 1)</text>
<text x="30" y="240" font-size="24" fill="#1e1e1e" text-anchor="start">  (descarta)</text>
<text x="30" y="276" font-size="24" fill="#1e1e1e" text-anchor="start">fim sem return: lixo</text>
</svg>
