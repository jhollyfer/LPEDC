<svg xmlns="http://www.w3.org/2000/svg" width="498" height="434" viewBox="0 0 498 434">
<title>árvore binária</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="498" height="434" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">árvore binária</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">altura 0: de 1 a 1 nó</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">altura 1: de 2 a 3 nós</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">altura 2: de 3 a 7 nós</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">altura 3: de 4 a 15 nós</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">altura h: de h+1 a 2^(h+1) - 1</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">raiz no nível 1, profund. d:</text>
<text x="30" y="352" font-size="24" fill="#1e1e1e" text-anchor="start">  de d a 2^d - 1 nós</text>
<text x="30" y="388" font-size="24" fill="#1e1e1e" text-anchor="start">  nível k: até 2^(k-1) nós</text>
</svg>
