<svg xmlns="http://www.w3.org/2000/svg" width="907" height="214" viewBox="0 0 907 214">
<title>aula-0153-1</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="907" height="214" fill="#ffffff"/>
<text x="30" y="60" font-size="24" fill="#1e1e1e" text-anchor="start">árvore {A}:        candidatas A-C 1, A-B 2, A-D 2  -&gt; A-C</text>
<text x="30" y="96" font-size="24" fill="#1e1e1e" text-anchor="start">árvore {A,C}:      candidatas C-D 1, A-B 2, A-D 2  -&gt; C-D</text>
<text x="30" y="132" font-size="24" fill="#1e1e1e" text-anchor="start">árvore {A,C,D}:    candidatas B-D 1, A-B 2          -&gt; B-D</text>
<text x="30" y="168" font-size="24" fill="#1e1e1e" text-anchor="start">árvore {A,B,C,D}:  soma 1 + 1 + 1 = 3</text>
</svg>
