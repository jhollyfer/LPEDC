<svg xmlns="http://www.w3.org/2000/svg" width="498" height="290" viewBox="0 0 498 290">
<title>c[0][0]</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="498" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">c[0][0]</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">k=0: a[0][0]*b[0][0] = 1*2 = 2</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">k=1: a[0][1]*b[1][0] = 2*0 = 0</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">k=2: a[0][2]*b[2][0] = 0*1 = 0</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">c[0][0] = 2</text>
</svg>
