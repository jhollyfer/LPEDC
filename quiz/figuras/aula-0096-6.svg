<svg xmlns="http://www.w3.org/2000/svg" width="513" height="290" viewBox="0 0 513 290">
<title>desempate</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="513" height="290" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">desempate</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">compara(a, b):</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">  se cidade(a) != cidade(b):</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">    devolve a ordem das cidades</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">  senão:</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">    devolve a ordem de chegada</text>
</svg>
