<svg xmlns="http://www.w3.org/2000/svg" width="469" height="362" viewBox="0 0 469 362">
<title>não é O(n)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="469" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">não é O(n)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">3n² + 10n + 20 &lt;= c·n ?</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">divide por n:</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">3n + 10 + 20/n &lt;= c</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">c = 100  -&gt; falha em n = 30</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">c = 1000 -&gt; falha em n = 330</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">nenhum c serve</text>
</svg>
