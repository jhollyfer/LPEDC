<svg xmlns="http://www.w3.org/2000/svg" width="498" height="362" viewBox="0 0 498 362">
<title>sequência</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="498" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">sequência</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">for (i = 0; i &lt; n; i++) c++;</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">for (i = 0; i &lt; n; i++)</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">  for (j = 0; j &lt; n; j++) c++;</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">n = 8   -&gt; 8 + 64   = 72</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n = 16  -&gt; 16 + 256 = 272</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">O(n) + O(n²) = O(n²)</text>
</svg>
