<svg xmlns="http://www.w3.org/2000/svg" width="528" height="362" viewBox="0 0 528 362">
<title>O(log n)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="528" height="362" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">O(log n)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">c = 0;</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">for (i = 1; i &lt; n; i *= 2)</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">  c++;</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">n = 8   -&gt; i = 1,2,4: 3 voltas</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n = 16  -&gt; i = 1,2,4,8: 4 voltas</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">n dobrou: ganhou 1 volta</text>
</svg>
