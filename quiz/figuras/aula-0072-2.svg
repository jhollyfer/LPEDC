<svg xmlns="http://www.w3.org/2000/svg" width="469" height="398" viewBox="0 0 469 398">
<title>O(n)</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="469" height="398" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">O(n)</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">maior = v[0];</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">for (i = 1; i &lt; n; i++)</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">  if (v[i] &gt; maior)</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">    maior = v[i];</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n = 8   -&gt; 7 voltas</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start">n = 16  -&gt; 15 voltas</text>
<text x="30" y="352" font-size="24" fill="#1e1e1e" text-anchor="start">n dobrou: as voltas dobraram</text>
</svg>
