<svg xmlns="http://www.w3.org/2000/svg" width="349" height="506" viewBox="0 0 349 506">
<title>árvore de decisão</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="349" height="506" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">árvore de decisão</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">A&gt;B?</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start"> não: B&gt;C?</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">   não: A B C</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start">   sim: A&gt;C?</text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">     não: A C B</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">     sim: C A B</text>
<text x="30" y="316" font-size="24" fill="#1e1e1e" text-anchor="start"> sim: A&gt;C?</text>
<text x="30" y="352" font-size="24" fill="#1e1e1e" text-anchor="start">   não: B A C</text>
<text x="30" y="388" font-size="24" fill="#1e1e1e" text-anchor="start">   sim: B&gt;C?</text>
<text x="30" y="424" font-size="24" fill="#1e1e1e" text-anchor="start">     não: B C A</text>
<text x="30" y="460" font-size="24" fill="#1e1e1e" text-anchor="start">     sim: C B A</text>
</svg>
