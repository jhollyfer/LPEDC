<svg xmlns="http://www.w3.org/2000/svg" width="455" height="326" viewBox="0 0 455 326">
<title>T(n) = 2T(n-1) + 1</title>
<style>text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;white-space:pre}</style>
<rect x="0" y="0" width="455" height="326" fill="#ffffff"/>
<text x="30" y="44" font-size="30" fill="#862e9c" text-anchor="start">T(n) = 2T(n-1) + 1</text>
<text x="30" y="100" font-size="24" fill="#1e1e1e" text-anchor="start">nível 0:  T(3)          = 1</text>
<text x="30" y="136" font-size="24" fill="#1e1e1e" text-anchor="start">nível 1:  T(2) T(2)     = 2</text>
<text x="30" y="172" font-size="24" fill="#1e1e1e" text-anchor="start">nível 2:  T(1) x 4      = 4</text>
<text x="30" y="208" font-size="24" fill="#1e1e1e" text-anchor="start"></text>
<text x="30" y="244" font-size="24" fill="#1e1e1e" text-anchor="start">total = 2^n - 1 = 7</text>
<text x="30" y="280" font-size="24" fill="#1e1e1e" text-anchor="start">n níveis que dobram: Θ(2ⁿ)</text>
</svg>
